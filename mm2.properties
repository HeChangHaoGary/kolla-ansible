# mm2.properties - MirrorMaker 2 Configuration
# =========================================
# Cluster Aliases Definition
# =========================================
clusters = source,destination

# =========================================
# Source Cluster Configuration (k8s internal access - PLAINTEXT)
# =========================================
source.bootstrap.servers = 10.220.244.176:9092,10.220.244.177:9092,10.220.244.178:9092
source.security.protocol = PLAINTEXT

# =========================================
# Destination Cluster Configuration
# =========================================
destination.bootstrap.servers = 10.220.57.24:9092,10.220.57.25:9092,10.220.57.26:9092
# If destination requires SASL_SSL (uncomment and configure below):
# destination.security.protocol = SASL_SSL
# destination.sasl.mechanism = PLAIN
# destination.sasl.jaas.config = org.apache.kafka.common.security.plain.PlainLoginModule required username="your-username" password="your-password";
# destination.ssl.truststore.location = /etc/kafka/secrets/client.truststore.jks
# destination.ssl.endpoint.identification.algorithm =

# =========================================
# Replication Flow: source -> destination
# =========================================
source->destination.enabled = true
source->destination.topics = .*
# Optional: Exclude internal topics
source->destination.topics.exclude = ^__.*
source->destination.replication.factor = 3
source->destination.producer.enable.idempotence = true
source->destination.producer.acks = all

# =========================================
# Disable Reverse Replication (destination -> source)
# =========================================
destination->source.enabled = false

# =========================================
# Replication Policy (Topic Name Mapping)
# =========================================
# IdentityReplicationPolicy: keeps original topic names (my-topic -> my-topic)
replication.policy.class = org.apache.kafka.connect.mirror.IdentityReplicationPolicy
replication.policy.separator = .

# =========================================
# Global Configuration
# =========================================
tasks.max = 3
group.id = mm2-mirror-maker

# Disable topic config and ACL sync
sync.topic.configs.enabled = false
sync.topic.acls.enabled = false

# Enable checkpoints for consumer offset sync
emit.checkpoints.enabled = true

# =========================================
# Internal Topics Replication Factors
# =========================================
replication.factor = 3
checkpoints.topic.replication.factor = 3
heartbeats.topic.replication.factor = 3
offset-syncs.topic.replication.factor = 3

# =========================================
# Connector Configuration
# =========================================
connector.client.config.override.policy = All

# =========================================
# Consumer Tuning (Source)
# =========================================
source.consumer.fetch.max.bytes = 67108864
source.consumer.max.partition.fetch.bytes = 67108864
source.consumer.max.poll.records = 5000
source.consumer.group.id = mm2-checkpoint-consumer
source.consumer.session.timeout.ms = 60000
source.consumer.request.timeout.ms = 120000
source.consumer.auto.offset.reset = earliest

# =========================================
# Producer Performance Optimization (Destination)
# =========================================
producer.batch.size = 16384
producer.linger.ms = 1
producer.enable.idempotence = true
producer.override.acks = all
producer.override.retries = 10
producer.override.delivery.timeout.ms = 120000
producer.override.compression.type = snappy
producer.override.max.request.size = 67108864

# =========================================
# Additional Settings
# =========================================
metric.reporters =
